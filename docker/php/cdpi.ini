; PHP settings for the cdpi/website-v2 image.
;
; Installed as /usr/local/etc/php/conf.d/zz-cdpi.ini -- the "zz-" prefix makes
; it the last conf.d file PHP reads, so these values win over the official
; image's own drop-ins (error-logging.ini, opcache-recommended.ini).
;
; The @TOKEN@ placeholders are substituted at build time from Dockerfile build
; args (PHP_UPLOAD_MAX_FILESIZE and friends), so the limits can be changed in
; one place without editing this file. See docs/runbooks/20-image.md.
;
; !! PLACEHOLDER DEFAULTS !! The four templated limits below are the plan's
; sensible defaults, NOT production's measured values. scripts/host/discover.sh
; prints production's php.ini limits; set the Dockerfile ARG defaults to those
; before cutover, or the container will silently accept smaller media uploads
; than the current site does.

upload_max_filesize = @UPLOAD_MAX_FILESIZE@
post_max_size = @POST_MAX_SIZE@
memory_limit = @MEMORY_LIMIT@
max_execution_time = @MAX_EXECUTION_TIME@
max_input_time = @MAX_EXECUTION_TIME@

; Errors go to the container log (stderr), never to the response body. The
; official image already does this in error-logging.ini; repeating it here
; means a later drop-in cannot quietly turn display_errors back on.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Note that WordPress overrides error_reporting at runtime (wp_debug_mode():
; only errors and warnings unless WP_DEBUG is on), so deprecations from the
; theme only show up in the log when WORDPRESS_DEBUG=1 is set in the
; environment. This value is what applies before WordPress loads.
error_reporting = E_ALL & ~E_DEPRECATED

; Do not advertise the PHP version in response headers.
expose_php = Off

; The docroot is baked and never modified at runtime (DISALLOW_FILE_MODS), so
; opcache can trust its cache for the container's whole life and skip the
; stat() call on every include. A code change is a new image, never an edit.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Sessions and upload scratch files land on the container's writable /tmp
; (a tmpfs in deploy/compose.yaml), never in the docroot.
upload_tmp_dir = /tmp
session.save_path = /tmp
