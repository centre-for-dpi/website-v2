# Installed as /etc/ssh/sshd_config.d/01-cdpi-keys.conf, mode 0644, root:root.
#
# Authorised keys live in a root-owned directory, so an account cannot add a
# key to itself and removing someone from admins.txt actually revokes their
# access (install.sh rewrites the file rather than appending to it).
# ~/.ssh/authorized_keys is kept as a second source so the cloud-init
# accounts that already exist on staging, and the break-glass account the
# cloud provider's key pair unlocks, keep working.
AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u .ssh/authorized_keys
