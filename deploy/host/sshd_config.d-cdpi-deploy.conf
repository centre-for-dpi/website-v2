# Installed as /etc/ssh/sshd_config.d/10-cdpi-deploy.conf, mode 0644, root:root.
# install.sh runs `sshd -t` and reloads ssh only if the test passes.
#
# Everything the deploy user can do over SSH is decided here: sshd discards
# whatever command the client asked for and runs the wrapper instead, which
# accepts only `deploy <tag>`, `rollback` and `status`. A bare
# `ssh deploy@host` therefore reaches the wrapper with an empty
# SSH_ORIGINAL_COMMAND, which it refuses with exit 126 — there is no shell
# on the other end to fall back to.
#
# Match blocks must come after all global keywords in a file, so this lives
# in its own drop-in and nothing is appended below it.
Match User deploy
	ForceCommand /usr/local/bin/cdpi-deploy
	PasswordAuthentication no
	AllowTcpForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
	PermitTunnel no
