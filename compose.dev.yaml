# Local development stack for the container image. NOT used on any host:
# staging and production run deploy/compose.yaml (WP4). This file exists so a
# developer can build the image from this checkout, boot it against a throwaway
# MySQL and see the site, the build marker and the theme assets exactly as the
# hosts will serve them. See docs/runbooks/20-image.md.
#
#   docker compose -f compose.dev.yaml up -d --build
#   docker compose -f compose.dev.yaml run --rm --user www-data wordpress wp core install ...
#   docker compose -f compose.dev.yaml down -v
#
# The site is published on 127.0.0.1:8080; set CDPI_DEV_PORT in the shell to
# use another port (it is applied to both the port mapping and the site URL).
name: cdpi-dev

services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwordpress", "-pwordpress"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    # `image:` names what `build:` produces, and it is the same name the runbook
    # uses for a manual `docker build -t cdpi-local .`, so either path yields
    # one local image and `up` never pulls anything.
    image: cdpi-local
    build:
      context: .
      args:
        GIT_SHA: dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CDPI_DEV_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WP_HOME: http://localhost:${CDPI_DEV_PORT:-8080}
      WP_SITEURL: http://localhost:${CDPI_DEV_PORT:-8080}
      # Anything but "production" makes functions.php send noindex.
      WP_ENVIRONMENT_TYPE: local
      # Set WORDPRESS_DEBUG: "1" to log PHP notices and deprecations from the
      # theme to `docker compose logs wordpress` (WP_DEBUG_DISPLAY is kept off).
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      # Same mount point as deploy/compose.yaml: the only path www-data can
      # write to.
      - uploads:/var/www/html/wp-content/uploads
    tmpfs:
      - /tmp
    healthcheck:
      # Mirrors the deploy stack's check, including the X-Forwarded-Proto
      # header Caddy sends, so a healthcheck regression shows up locally.
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' -o /dev/null http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db_data:
  uploads:
