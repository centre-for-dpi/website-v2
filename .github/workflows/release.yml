name: Release

# Builds the container image once per merge to main (and once per release tag)
# and publishes it to GHCR tagged with the full commit SHA (ADR-004). This
# workflow never runs on pull_request: it needs `packages: write` and the
# `build` environment, and nothing that runs for a pull request may see either.
#
# Two triggers, two shapes:
#
#   push   -> build, then deploy-staging with the tag `build` just produced.
#             (A v* tag push builds/skips the same commit and redeploys its
#             sha- tag to staging; production is never reached from a push.)
#   dispatch (`gh workflow run release.yml -f image_tag=… -f environment=…`)
#          -> no build: deploy an existing tag to staging or production. This
#             is the rollback and redeploy path (docs/runbooks/rollback.md).
#             `production` waits for the environment's required reviewers.
#
# Staging is pushed to over SSH (ADR-008). Production is pulled: nothing can
# SSH into it, so the approved `deploy-production` job moves the git tag
# `production` to the released commit and the host's cron picks it up
# (deploy/host/cdpi-deploy-theme; docs/runbooks/03-production-checkout.md;
# ADR-004 amendment 2026-10-26). The `image_tag` input names the commit for
# both: the image for staging, the git commit for production.
#
# Each deploy job is skipped until its repo variable is `true`:
# STAGING_DEPLOYS_ENABLED (end of the staging bootstrap, runbook 02) and
# PRODUCTION_DEPLOYS_ENABLED (end of runbook 03). Until then a run stops after
# `build` (push) or `validate` (dispatch) without touching any host or tag.
#
# Secrets and variables are read only inside jobs bound to an environment
# (`build`, `staging`, `production`), each with the deployment branch policy
# main + v*. The `production` tag this workflow moves never triggers it:
# the push trigger below matches `v*` tags only, and ci.yml runs on branches
# only.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy: sha-<40 hex> or vX.Y.Z (must already exist in GHCR)'
        type: string
        required: true
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read
  packages: write

# One release run per ref at a time, and never cancel one that is already
# pushing: an interrupted push could leave a half-published image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Dispatch only: reject a malformed tag before any environment (and, for
  # production, any reviewer) is involved. The host wrapper checks the same
  # pattern again.
  validate:
    name: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Validate image_tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ ! $IMAGE_TAG =~ ^(sha-[0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::image_tag '$IMAGE_TAG' is not sha-<40 hex> or vX.Y.Z"
            exit 1
          fi
          echo "Dispatch: deploy $IMAGE_TAG to $TARGET"

  build:
    name: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The `build` environment carries the deployment branch policy (main and
    # v* only), so even a workflow file edited on another branch cannot push.
    environment: build
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      skipped: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Check out the commit being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha-<full 40-hex sha> on every run; plus the tag name on v* tags.
          # No `latest`: every deploy names an exact tag (ADR-004).
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
          flavor: |
            latest=false

      - name: Immutability guard
        id: guard
        # GHCR does not enforce tag immutability, so this job does: if the
        # sha- tag already exists (a re-run, or a tag push for a commit that was
        # already built from main) the image is not rebuilt or re-pushed.
        # `docker manifest inspect` exits non-zero when the tag is absent.
        env:
          SHA_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$SHA_TAG" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::$SHA_TAG already exists in GHCR; tags are immutable, so the build and push are skipped."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
            echo "$SHA_TAG does not exist yet; building."
          fi

      - name: Build and push
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Attestations create extra untagged manifests that the retention
          # workflow (WP7) would sweep; keep the push to the one image index.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the image tag
        id: tag
        env:
          TAG: sha-${{ github.sha }}
        run: echo "image_tag=$TAG" >>"$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SKIPPED: ${{ steps.guard.outputs.skip }}
        run: |
          set -euo pipefail
          if [ "$SKIPPED" = 'true' ]; then
            echo "Skipped: image already published as $REGISTRY/$IMAGE_NAME:sha-$GITHUB_SHA"
          else
            echo "Pushed:"
            printf '%s\n' "$TAGS" | sed 's/^/  /'
          fi
          {
            echo "## Image"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            if [ "$SKIPPED" = 'true' ]; then echo "_(already existed; not rebuilt)_"; fi
          } >>"$GITHUB_STEP_SUMMARY"

  # Staging: every push run after a successful build, or a dispatch that
  # targets staging. `always()` lets the dispatch path run while `build` is
  # skipped; the result checks keep a failed build from deploying anything.
  # Skipped (not failed) until the repo variable STAGING_DEPLOYS_ENABLED is
  # `true`, which runbook 02 sets as the last step of the staging bootstrap.
  deploy-staging:
    name: deploy-staging
    needs: [validate, build]
    if: >-
      always() && !cancelled() &&
      vars.STAGING_DEPLOYS_ENABLED == 'true' &&
      (
        (github.event_name == 'push' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && needs.validate.result == 'success')
      )
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
    # One deploy per host at a time, never interrupted: the host script holds
    # its own flock too, but a cancelled runner would lose the log.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Check out the composite action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Deploy and verify
        uses: ./.github/actions/remote-deploy
        with:
          environment: staging
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          known_hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          site_url: ${{ vars.SITE_URL }}
          smoke_ca_cert: ${{ vars.SMOKE_CA_CERT }}
          image_tag: ${{ github.event_name == 'push' && needs.build.outputs.image_tag || inputs.image_tag }}

  # Production: dispatch only, never from a push. The `production` environment
  # holds the run until a required reviewer approves (that approval is the
  # audit trail for a release or a rollback), and the job does not exist at
  # all until the repo variable PRODUCTION_DEPLOYS_ENABLED is `true` (runbook
  # 03). Until then a production dispatch validates the tag and ends there.
  #
  # Pull-based: this job never contacts the host. It moves the git tag
  # `production` to the released commit (the only write it makes) and then
  # polls the public site until it serves that commit's marker. On the host,
  # `cdpi-deploy-theme sync` runs from cron every minute, fetches, checks the
  # commit is on main and the tree is clean, checks it out, smokes locally
  # and reverts on failure.
  #
  # The tag is under the `protect-production-tag` ruleset (creation, update,
  # deletion; bypass: org admins and deploy keys), so no Write-role account
  # can release or roll back by moving it. GitHub does not accept the Actions
  # app as a bypass actor here, so the push is made with the write deploy key
  # `production-tag`, whose private half is the `production` environment
  # secret PRODUCTION_TAG_SSH_KEY (runbook 03 §4). GITHUB_TOKEN stays
  # read-only. The environment values read: SITE_URL, PRODUCTION_TAG_SSH_KEY.
  deploy-production:
    name: deploy-production
    needs: [validate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      vars.PRODUCTION_DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Check out main with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the release commit and check it is on main
        id: resolve
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          if [[ ! $IMAGE_TAG =~ ^(sha-[0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::image_tag '$IMAGE_TAG' is not sha-<40 hex> or vX.Y.Z"; exit 1
          fi
          if [[ ! $SITE_URL =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo "::error::SITE_URL must be https://<host>[:port] with no path (production environment variable), got '$SITE_URL'"; exit 1
          fi
          git fetch --quiet --force origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/tags/*'
          if [[ $IMAGE_TAG == sha-* ]]; then
            sha=${IMAGE_TAG#sha-}
            git cat-file -e "$sha^{commit}" 2>/dev/null ||
              { echo "::error::commit $sha does not exist in this repository"; exit 1; }
          else
            sha=$(git rev-parse --verify --quiet "refs/tags/$IMAGE_TAG^{commit}") ||
              { echo "::error::tag $IMAGE_TAG does not exist in this repository"; exit 1; }
          fi
          # The host refuses anything not reachable from origin/main; refuse
          # here first so the tag never points at an unreviewed commit.
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::commit $sha is not reachable from main; only merged commits can be released"; exit 1
          fi
          prev=$(git rev-parse --verify --quiet 'refs/tags/production^{commit}' || echo none)
          echo "release $IMAGE_TAG -> commit $sha (production tag was $prev)"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "prev=$prev" >>"$GITHUB_OUTPUT"

      - name: Move the production tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
          TAG_SSH_KEY: ${{ secrets.PRODUCTION_TAG_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z $TAG_SSH_KEY ]]; then
            echo "::error::The production environment has no PRODUCTION_TAG_SSH_KEY secret (the write deploy key that may move the production tag; runbook 03 §4)"
            exit 1
          fi
          umask 077
          # printf, not echo: the key never goes through a command line.
          printf '%s\n' "$TAG_SSH_KEY" >"$RUNNER_TEMP/tag_key"
          ssh-keygen -y -f "$RUNNER_TEMP/tag_key" >/dev/null || {
            echo "::error::PRODUCTION_TAG_SSH_KEY is not a readable private key"; exit 1; }
          # GitHub's SSH host keys, from its API over TLS, so the push host is
          # pinned rather than trusted on first use.
          curl -sS --max-time 20 https://api.github.com/meta |
            jq -r '.ssh_keys[] | "github.com " + .' >"$RUNNER_TEMP/github_known_hosts"
          [[ -s $RUNNER_TEMP/github_known_hosts ]] || {
            echo "::error::Could not fetch GitHub's SSH host keys from api.github.com/meta"; exit 1; }

          # Annotated, with the run id in the message: every approved dispatch
          # is a distinct tag object, so the host can tell a re-release of the
          # same commit from the tag it already tried (see
          # deploy/host/cdpi-deploy-theme, `sync`).
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag --force --annotate \
              --message "release $IMAGE_TAG ($SHA) dispatched by $GITHUB_ACTOR, run $GITHUB_RUN_ID" \
              production "$SHA"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tag_key -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$RUNNER_TEMP/github_known_hosts -o StrictHostKeyChecking=yes" \
            git push --force --quiet "git@github.com:$GITHUB_REPOSITORY.git" refs/tags/production
          echo "production tag now points at $SHA"

      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/tag_key" "$RUNNER_TEMP/github_known_hosts"

      - name: Wait for production to serve the release
        id: smoke
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          PREV: ${{ steps.resolve.outputs.prev }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          site_url=${SITE_URL%/}
          echo "Expecting HTTP 200 and <meta name=\"cdpi-build\" content=\"$SHA\"> from $site_url/ within 8 minutes"
          body=$RUNNER_TEMP/smoke_body
          for attempt in $(seq 1 32); do
            code=$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$site_url/" 2>"$RUNNER_TEMP/smoke_err") || {
              code=000; : >"$body"; }
            marker=$(grep -o -m1 'name="cdpi-build" content="[0-9a-f]\{40\}"' "$body" 2>/dev/null |
              grep -o '[0-9a-f]\{40\}' || true)
            if [[ $code == 200 && $marker == "$SHA" ]]; then
              echo "smoke: OK on attempt $attempt, HTTP 200, marker $marker"
              echo "marker=$marker" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "smoke: attempt $attempt/32 HTTP $code marker=${marker:-none}$( [[ $code == 000 ]] && printf ' (%s)' "$(cat "$RUNNER_TEMP/smoke_err")" )"
            sleep 15
          done
          echo "::error::production did not pick up the release within 8 minutes: $site_url/ is not serving HTTP 200 with marker $SHA. Check ~/.local/state/cdpi-deploy/cron.log and deploy.log on the host (cdpi-deploy-theme status). The production tag now points at $SHA; previously it was $PREV. A failed smoke on the host reverts the checkout by itself and is not retried until the tag moves: re-dispatch to try again, or dispatch $PREV to roll back."
          exit 1

      - name: Job summary
        if: always()
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
          PREV: ${{ steps.resolve.outputs.prev }}
          SITE_URL: ${{ vars.SITE_URL }}
          MARKER: ${{ steps.smoke.outputs.marker }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [[ -n $MARKER ]]; then serving="\`$MARKER\`"; else serving="_not verified_"; fi
          if [[ $PREV == none || -z $PREV ]]; then
            rollback="_none: first release through the pipeline_"
          else
            rollback="\`gh workflow run release.yml -f image_tag=sha-$PREV -f environment=production\`"
          fi
          {
            echo "## Deploy to production"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`$IMAGE_TAG\` |"
            echo "| Production tag moved to | \`${SHA:-?}\` |"
            echo "| Previous tag target | \`${PREV:-?}\` |"
            echo "| Serving commit | $serving |"
            echo "| URL | $SITE_URL |"
            echo "| Smoke | $SMOKE_OUTCOME |"
            echo "| Rollback | $rollback |"
          } >>"$GITHUB_STEP_SUMMARY"
