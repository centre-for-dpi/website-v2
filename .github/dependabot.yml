# Dependabot keeps four things from going stale: the commit SHAs the workflows
# pin their actions to, the npm build toolchain, the image base tags in the
# Dockerfile and the compose files, and the Composer plugin pins. Updates
# arrive as ordinary pull requests, so they go through the same lint, build
# and image checks as any other change.
version: 2
updates:
  # Rewrites the pinned SHA and the "# vX.Y.Z" comment together, which is the
  # only maintainable way to keep SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # Everything that participates in producing public/js and public/css.
      # These move together and are only meaningful when reviewed together: the
      # acceptance test for any of them is that `npm run build` still emits a
      # working manifest, which the build job checks on the grouped PR.
      build-toolchain:
        dependency-type: development
        patterns:
          - "webpack*"
          - "*-webpack-plugin"
          - "*-loader"
          - "sass*"
          - "postcss*"
          - "autoprefixer"
          - "babel*"
          - "@babel/*"
          - "css-*"
          - "mini-css-extract-plugin"
      # Formatting and git hooks. These cannot change the built output, so they
      # are reviewed separately and can be merged on a glance at the diff.
      dev-tooling:
        dependency-type: development
        patterns:
          - "prettier"
          - "husky"
          - "lint-staged"

  # Core and PHP upgrades: Dependabot rewrites the FROM lines in the
  # Dockerfile. Note the ARG defaults (WP_IMAGE_TAG, WP_CLI_IMAGE_TAG) are what
  # actually select the wordpress tag; review that both move together. Every
  # bump is proven by image-theme-stage on the PR and by the release build on
  # main.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    commit-message:
      prefix: build

  # Host-side image pins in deploy/compose*.yaml (caddy, mysql). The
  # deploy-tooling job validates the overlays and the Caddyfile against the
  # bumped caddy tag, so a Caddy release that changes the config language is
  # caught on the PR.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    commit-message:
      prefix: deploy

  # Plugin pins. Every bump is a PR that rebuilds the image, so a plugin
  # update is reviewed and deployed like any other change (ADR-004).
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    commit-message:
      prefix: build
